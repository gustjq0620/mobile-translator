<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="실시간 번역" />
  <title>실시간 마이크 번역기</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#0b1020; --panel:#151c2f; --panel2:#111827; --text:#f8fafc;
      --muted:#94a3b8; --line:#26324a; --accent:#22c55e; --danger:#ef4444;
      --live:#38bdf8; --preview:#bae6fd;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .wrap{width:min(760px,100%);margin:0 auto;padding:18px 14px 34px}
    h1{font-size:24px;margin:5px 0 6px}
    .sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
    .panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px}
    .panel{padding:14px;margin:12px 0}
    .langs{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:center}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
    select,button{font:inherit;-webkit-tap-highlight-color:transparent}
    select{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;font-size:16px}
    #swap{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-top:18px;font-size:20px}
    .mic{width:100%;min-height:82px;border:0;border-radius:20px;background:var(--accent);color:#052e16;font-weight:800;font-size:22px;margin-top:12px}
    .mic.listening{background:var(--danger);color:white}
    .status{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:13px;color:var(--muted)}
    .dot{width:9px;height:9px;border-radius:50%;background:#64748b}
    .dot.on{background:var(--accent);box-shadow:0 0 0 5px rgba(34,197,94,.13)}
    .live-badge{display:none;margin-left:auto;padding:3px 8px;border-radius:999px;background:rgba(56,189,248,.12);color:var(--live);font-size:11px;font-weight:700}
    .live-badge.on{display:inline-flex}
    .cards{display:grid;grid-template-columns:1fr;gap:12px}
    .card{padding:15px;min-height:170px}
    .card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
    .text{font-size:21px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .interim{color:#94a3b8}
    .preview{color:var(--preview)}
    .history{color:#e0f2fe}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .smallbtn{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:0 14px;font-weight:650}
    .tog{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;margin-top:12px}
    .tog input{width:20px;height:20px}
    .note{font-size:12px;line-height:1.55;color:var(--muted);margin-top:10px}
    .error{color:#fecaca}
    .hint{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(56,189,248,.08);color:#cbd5e1;font-size:12px;line-height:1.5}
    @media(min-width:650px){.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>🎙️ 실시간 마이크 번역기</h1>
  <div class="sub">말하는 도중의 문장도 약 0.6초 간격으로 계속 번역합니다. 잠깐 멈춰도 자동으로 다시 듣습니다.</div>

  <section class="panel">
    <div class="langs">
      <div>
        <label for="source">말하는 언어</label>
        <select id="source">
          <option value="ko" data-speech="ko-KR">한국어</option>
          <option value="en" data-speech="en-US">English</option>
          <option value="zh-CN" data-speech="zh-CN">中文(简体)</option>
          <option value="ja" data-speech="ja-JP">日本語</option>
        </select>
      </div>
      <button id="swap" type="button" aria-label="언어 바꾸기">⇄</button>
      <div>
        <label for="target">번역 언어</label>
        <select id="target">
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="zh-CN">中文(简体)</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>

    <button id="mic" class="mic" type="button">마이크 시작</button>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">대기 중</span>
      <span id="liveBadge" class="live-badge">LIVE</span>
    </div>

    <label class="tog">
      <input id="autoSpeak" type="checkbox" />
      확정된 번역문 자동으로 읽기
    </label>
    <div class="hint">실시간 미리보기 번역은 연한 파란색으로 표시되고, 문장이 확정되면 번역 기록에 남습니다.</div>
  </section>

  <section class="cards">
    <article class="card">
      <h2>원문</h2>
      <div id="original" class="text">마이크 시작을 누르고 말해보세요.</div>
    </article>
    <article class="card">
      <h2>실시간 번역 <span id="previewTag" class="live-badge">번역 중</span></h2>
      <div id="translation" class="text">번역 결과가 여기에 표시됩니다.</div>
      <div class="actions">
        <button id="speak" class="smallbtn" type="button">🔊 읽기</button>
        <button id="clear" class="smallbtn" type="button">지우기</button>
      </div>
    </article>
  </section>
  <div id="msg" class="note"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const source=$('source'), target=$('target'), swap=$('swap'), mic=$('mic');
  const dot=$('dot'), statusText=$('statusText'), liveBadge=$('liveBadge');
  const original=$('original'), translation=$('translation'), previewTag=$('previewTag');
  const speakBtn=$('speak'), clearBtn=$('clear'), autoSpeak=$('autoSpeak'), msg=$('msg');

  let recognition=null, wantsListening=false;
  let finalSource='', interimSource='';
  let finalTranslations=[];
  let livePreview='';
  let previewTimer=null, previewAbort=null, previewSeq=0;
  let lastSpoken='', restartTimer=null;

  const speechLang = () => source.options[source.selectedIndex].dataset.speech || 'ko-KR';

  function setStatus(text,on=false){
    statusText.textContent=text;
    dot.classList.toggle('on',on);
    liveBadge.classList.toggle('on',on);
    mic.classList.toggle('listening',on);
    mic.textContent=on?'중지':'마이크 시작';
  }
  function message(text='',error=false){
    msg.textContent=text;
    msg.classList.toggle('error',!!error);
  }
  function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

  function renderOriginal(){
    if(!finalSource && !interimSource){
      original.textContent=wantsListening?'듣는 중...':'마이크 시작을 누르고 말해보세요.';
      return;
    }
    original.innerHTML=esc(finalSource)+(interimSource?'<span class="interim">'+esc(interimSource)+'</span>':'');
  }
  function renderTranslation(){
    const history=finalTranslations.join(' ').trim();
    const preview=livePreview.trim();
    if(!history && !preview){
      translation.textContent=wantsListening?'음성을 기다리는 중...':'번역 결과가 여기에 표시됩니다.';
      previewTag.classList.remove('on');
      return;
    }
    translation.innerHTML=(history?'<span class="history">'+esc(history)+'</span>':'')+
      (preview?((history?' ':'')+'<span class="preview">'+esc(preview)+'</span>'):'');
    previewTag.classList.toggle('on',!!preview);
  }

  async function translate(text, signal){
    text=(text||'').trim();
    if(!text) return '';
    if(source.value===target.value) return text;

    // MyMemory free endpoint has a query-length limit; keep the live chunk compact.
    if(text.length>420) text=text.slice(-420);

    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+
      '&langpair='+encodeURIComponent(source.value+'|'+target.value);
    const res=await fetch(url,{signal});
    if(!res.ok) throw new Error('번역 서버 응답 오류 '+res.status);
    const data=await res.json();
    const out=data && data.responseData && data.responseData.translatedText;
    if(!out) throw new Error('번역 결과 없음');
    return out;
  }

  function schedulePreview(text){
    clearTimeout(previewTimer);
    const t=(text||'').trim();
    if(!t){ livePreview=''; renderTranslation(); return; }

    previewTimer=setTimeout(async()=>{
      const seq=++previewSeq;
      if(previewAbort) previewAbort.abort();
      previewAbort=new AbortController();
      try{
        setStatus('듣는 중 · 실시간 번역',true);
        const out=await translate(t,previewAbort.signal);
        if(seq!==previewSeq) return;
        livePreview=out;
        renderTranslation();
      }catch(e){
        if(e && e.name==='AbortError') return;
        if(seq===previewSeq) message('실시간 번역 지연: '+(e?.message||e),true);
      }finally{
        if(wantsListening) setStatus('듣는 중',true);
      }
    },600);
  }

  async function commitFinalTranslation(text){
    const t=(text||'').trim();
    if(!t) return;
    try{
      const out=await translate(t);
      finalTranslations.push(out);
      livePreview='';
      renderTranslation();
      message('실시간 번역 중');
      if(autoSpeak.checked && out){
        lastSpoken=out;
        speak(out);
      }
    }catch(e){
      message('확정 문장 번역 실패: '+(e?.message||e),true);
    }
  }

  function speak(text){
    if(!('speechSynthesis' in window)||!text) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const m={'ko':'ko-KR','en':'en-US','zh-CN':'zh-CN','ja':'ja-JP'};
    u.lang=m[target.value]||target.value;
    speechSynthesis.speak(u);
  }

  function buildRecognition(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      message('이 Safari에서는 브라우저 음성인식 기능을 사용할 수 없습니다. iOS를 최신 버전으로 업데이트한 뒤 Safari에서 다시 열어주세요.',true);
      mic.disabled=true;
      mic.style.opacity='.55';
      return null;
    }
    const r=new SR();
    r.continuous=true;
    r.interimResults=true;
    r.maxAlternatives=1;
    r.lang=speechLang();

    r.onstart=()=>{ setStatus('듣는 중',true); message('실시간으로 듣고 있습니다.'); };

    r.onresult=(event)=>{
      let newFinal='', interim='';
      for(let i=event.resultIndex;i<event.results.length;i++){
        const txt=event.results[i][0].transcript||'';
        if(event.results[i].isFinal) newFinal+=txt+' ';
        else interim+=txt;
      }

      interimSource=interim;
      if(newFinal){
        finalSource+=newFinal;
        interimSource='';
        // Final result becomes permanent translation.
        commitFinalTranslation(newFinal);
      }

      renderOriginal();
      // Translate the partial phrase while the user is still speaking.
      if(interimSource.trim()) schedulePreview(interimSource);
      else if(newFinal) schedulePreview('');
    };

    r.onerror=(event)=>{
      const code=event.error||'unknown';
      if(code==='not-allowed'||code==='service-not-allowed'){
        wantsListening=false;
        setStatus('마이크 권한 필요',false);
        message('Safari의 마이크 권한을 허용한 뒤 다시 시도하세요.',true);
      }else if(code!=='no-speech'&&code!=='aborted'){
        message('음성인식 오류: '+code,true);
      }
    };

    r.onend=()=>{
      clearTimeout(restartTimer);
      if(wantsListening){
        // iPhone Safari may end recognition after a pause, so restart automatically.
        restartTimer=setTimeout(()=>{
          try{ r.lang=speechLang(); r.start(); }
          catch(_){ setTimeout(()=>{try{r.start();}catch(__){}},500); }
        },180);
      }else setStatus('대기 중',false);
    };
    return r;
  }

  mic.addEventListener('click',()=>{
    if(!recognition) recognition=buildRecognition();
    if(!recognition) return;

    if(wantsListening){
      wantsListening=false;
      clearTimeout(restartTimer);
      clearTimeout(previewTimer);
      if(previewAbort) previewAbort.abort();
      try{recognition.stop();}catch(_){}
      setStatus('대기 중',false);
      message('중지됨');
    }else{
      wantsListening=true;
      recognition.lang=speechLang();
      try{recognition.start();}
      catch(_){setTimeout(()=>{try{recognition.start();}catch(__){}},300);}
    }
  });

  source.addEventListener('change',()=>{
    if(source.value===target.value) target.value=source.value==='ko'?'en':'ko';
    finalSource=''; interimSource=''; finalTranslations=[]; livePreview='';
    renderOriginal(); renderTranslation();
    if(recognition&&wantsListening){try{recognition.stop();}catch(_){}}
  });

  target.addEventListener('change',async()=>{
    finalTranslations=[]; livePreview='';
    renderTranslation();
    const text=finalSource.trim();
    if(text){
      try{
        const out=await translate(text);
        finalTranslations=[out];
        renderTranslation();
      }catch(e){message('번역 언어 변경 실패: '+(e?.message||e),true);}
    }
  });

  swap.addEventListener('click',()=>{
    const a=source.value,b=target.value;
    const srcOk=[...source.options].some(o=>o.value===b);
    const tgtOk=[...target.options].some(o=>o.value===a);
    if(srcOk&&tgtOk){source.value=b;target.value=a;}
    finalSource='';interimSource='';finalTranslations=[];livePreview='';
    renderOriginal();renderTranslation();
    if(recognition&&wantsListening){try{recognition.stop();}catch(_){}}
  });

  speakBtn.addEventListener('click',()=>{
    const text=(livePreview||finalTranslations[finalTranslations.length-1]||lastSpoken||'').trim();
    if(text) speak(text);
  });

  clearBtn.addEventListener('click',()=>{
    finalSource='';interimSource='';finalTranslations=[];livePreview='';lastSpoken='';
    clearTimeout(previewTimer); if(previewAbort) previewAbort.abort();
    renderOriginal();renderTranslation();message('');
    if('speechSynthesis' in window) speechSynthesis.cancel();
  });

  source.value='ko'; target.value='en';
})();
</script>
</body>
</html>
